name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:ci

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build production release artifact
        run: npm run build:release

      - name: Run API integration tests
        run: dotnet test server/ChurchServe.Api.Tests/ChurchServe.Api.Tests.csproj --configuration Release

      - name: Check EF Core model drift
        run: dotnet ef migrations has-pending-model-changes --project server/ChurchServe.Api

      - name: Verify published release artifact
        run: npm run test:release

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: churchserve-react-${{ github.sha }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 7
